# Central gate policy — single source of truth for submission gates.
# Every threshold used by scripts/check_submission.py lives here.
# Sources are cited per-value. When a value changes, change it HERE only,
# and the gates + their red-tests will follow.

served_model:
  # Kaggle serves this exact model at inference.
  name: gemma-4-31b-it-qat-w4a16-ct
  source: AGENTS.md strict-constraints; HARNESS_README.md:177/185 model allowlist

adapter:
  # required_base_model is ADVISORY ONLY. The harness imposes NO rule that an
  # adapter's base_model_name_or_path must equal the served model: discover_adapters()
  # (HARNESS_README.md:204) registers adapters as --lora-modules name=path and vLLM
  # applies them to the already-loaded base, so the adapter's own base string is
  # never consulted when choosing serving weights. A bnb-4bit-trained adapter served
  # onto a QAT w4a16 base is a NUMERICAL-FIDELITY risk worth surfacing, so the gate
  # WARNs; it never FAILs and never demands a retrain.
  required_base_model: gemma-4-31b-it-qat-w4a16-ct
  # SUBMIT-MODE OBLIGATION ONLY. In 'submit' the agent.yaml 'adapter:' key must
  # equal this name. Under the shipped default (local_test, below) it is unused:
  # no adapter ships, so there is no name to declare.
  declared_name: main_lora
  # SUBMIT-MODE OBLIGATION ONLY. In 'submit' this subdir must be populated and
  # contain adapter_model.safetensors. Under local_test an absent dir is a PASS.
  dir: adapters
  # Which obligation the adapter gates enforce, and WHY it is a REPO choice rather
  # than a harness mandate. The harness PERMITS an adapter; it never REQUIRES one:
  #   HARNESS_README.md:38    Adapters["adapters/* (Optional LoRA / Weights)"]
  #   HARNESS_README.md:85    "adapters/   # Optional: Fine-tuned PEFT LoRA adapters
  #                                 or model weights"
  #   HARNESS_README.md:110   "adapter (str | None): Optional adapter name matching
  #                                 a subdirectory or weight file under adapters/."
  #   HARNESS_README.md:128   "... the primary hard constraint is a total unpacked
  #                                 submission size of < 3 GiB ..., including all
  #                                 adapters/ weights, plus token ceilings"
  #   HARNESS_README.md:134   max_total_size_bytes = 3 GiB "total unpacked size,
  #                                 including adapters/"
  #   HARNESS_README.md:202-203  IF-USED placement instructions ("Place PEFT LoRA
  #                              directories ... inside adapters/<adapter_name>/",
  #                              "Reference adapter: <adapter_name> on any LlmAgent"),
  #                              conditional on shipping one at all. These lines were
  #                              previously cited here as if they MANDATED an adapter.
  #                              They do not: they govern the shape of an adapter IF
  #                              one is shipped, and the only hard constraint they
  #                              impose is a SIZE CEILING.
  # It follows that an adapter-less submission is a fully valid Kaggle submission,
  # so this gate's DEFAULT must not veto one -- which is exactly what the value
  # below records, and why it is deliberately NOT the consumer's DEFAULT_MODE.
  # 'submit' asserts the opposite obligation (an adapter MUST be declared in
  # agent.yaml AND present in adapters/; either one missing is a hard FAIL). It is
  # correct ONLY for a tree that actually ships one, where it stops a real LoRA
  # submission from silently losing its weights. 'local_test' is the mode for a
  # tree that ships none: the adapter is explicitly turned OFF (no 'adapter:' key in
  # agent.yaml), and a still-declared adapter is a hard FAIL because a tree with no
  # adapters/ weights must not claim to use them. There is no middle state where an
  # adapter is silently absent.
  # KNOWN LIMIT OF THE TWO-MODE VOCABULARY (consumer side, check_submission.py:591):
  # because 'local_test' FAILs a DECLARED adapter, this default would also veto a
  # future submission that legitimately ships one. Reconciling that needs a third
  # mode implemented in the consumer, not a different value here: gate_policy.yaml
  # can only select between the two behaviours the gate actually implements.
  # Selection precedence: --mode CLI flag > GATE_SUBMISSION_MODE env var > this
  # submission_mode default. Every scalar here reads back as a STRING, so the
  # consumer coerces/splits allowed_modes on comma.
  submission_mode: local_test
  allowed_modes: submit,local_test
  source: adapter is OPTIONAL per HARNESS_README.md:38,85,110; size-only ceiling :128,134; if-used placement :202-203; required_base_model from verified adapters_staging/main_lora/adapter_config.json base_model_name_or_path

tool_budget:
  # eval_config.yaml sets this; prompts/main.md MUST agree (parity gate).
  # main.md was corrected from a false 50 to this true 40 on 2026-10-04.
  max_tool_calls: 40
  source: my_submission/eval_config.yaml:4 evaluation.max_tool_calls

serving:
  # configs/sampling.yaml current values (verified compliant 2026-10-04).
  # thinking_level MUST be absent: LiteLLM mistranslates it into OpenAI
  # reasoning_effort, which the Kaggle Gemma runtime rejects.
  forbidden_sampling_keys: thinking_level
  include_thoughts_required: true
  thinking_budget_current: 4096
  max_output_tokens_current: 16384
  # PROJECT rule, NOT from HARNESS_README: the harness only requires
  # max_output_tokens + thinking_budget <= 32768, which 16384 passes. But
  # token_threshold is 14336, so large outputs crowd context before
  # compaction. docs/FINDINGS.md:76 flagged 16384 as the canary's
  # context-starvation bug. Asserted separately until a real Gemma run settles it.
  max_output_tokens_project_cap: 4096
  source: HARNESS_README.md:146-150,178; docs/FINDINGS.md:76,90-92

submission:
  # HARNESS_README.md:134 sets the size limit on UNPACKED total, not compressed zip size.
  max_unpacked_mb: 3072
  max_output_tokens_ceiling: 32768
  source: HARNESS_README.md:134,178

run_health:
  # Degenerate-run fingerprint from the one real Gemma 4 run: 129 rows, 0 resolved,
  # 117 empty patches, test_exit_code histogram {-1:115, 2:5, 1:6, 124:3},
  # 77/95 traces at zero completion tokens. If a run matches this, it is an
  # INFRASTRUCTURE FAILURE, not a quality result.
  zero_completion_token_traces_min_fraction: 0.5
  empty_patch_min_count: 100
  source: cloud_results/results/task_results.jsonl (verified 2026-10-04)

submission_quota:
  # Official rules allow ONE submission per day, not 5. The skill doc asserting
  # 5-per-24h is a defect to fix. See docs/gemma-and-the-shape-of-doubt.md:136.
  per_day: 1
  source: docs/gemma-and-the-shape-of-doubt.md:136

packaging:
  # SINGLE SOURCE OF TRUTH for what the packer EXCLUDES from submission.zip.
  #
  # g_zip_directory_drift compares the zip's members against EVERY file under
  # my_submission/. Without a shared exclusion filter, a file the packer
  # CORRECTLY omits (e.g. .DS_Store) is reported as "in dir not zip" and the gate
  # fails forever -- a permanent false FAIL that vetoes an otherwise valid
  # submission. The gate therefore honours this list.
  #
  # MANDATORY CONSUMER CONTRACT — scripts/submit_safe.sh MUST derive both its
  # junk purge (find ... -delete) and its zip -x filter from THIS list, so there
  # is exactly one exclusion vocabulary. A second, divergent list in the packer
  # is precisely the class of bug this whole policy file exists to prevent: the
  # gate would silently disagree with the packer about what is junk.
  #
  # Matched with fnmatch against the submission-relative POSIX path, so '*'
  # spans '/' (matching zip -x and find -name semantics for these patterns).
  excluded_globs: .DS_Store,*/.DS_Store,._*,*/._*,*/__pycache__/*,*.pyc,*.ipynb,*/.git/*,.git/*,*.swp,*~
  source: scripts/submit_safe.sh step-2 junk purge + zip -x (verified 2026-10-04)

hygiene:
  # SINGLE SOURCE OF TRUTH for docs that are ALLOWED to contain large embedded
  # source literals, so gate g_no_embedded_code_in_docs does not FAIL forever on
  # a deliberate design choice.
  #
  # gemma-and-the-shape-of-doubt.md is a RESEARCH EVIDENCE LOG: its whole point is
  # to embed source verbatim (15 literal lines, up to ~110k chars) with sha256
  # provenance so every claim stays reproducible. Rewriting it to satisfy a lint
  # would destroy the evidence it exists to preserve, and its line-2818
  # SAMPLING_HEALTH_RUNNER block is load-bearing prior art that
  # scripts/build_kaggle_kernel.py derives from.
  #
  # The exemption is EXPLICIT, NOT a silent skip: the gate still scans the doc and
  # prints an 'EXEMPT' line naming the file and this recorded reason, so a
  # maintainer can see the pass was a deliberate decision, not a blind spot.
  # Removing a name here immediately re-arms the gate for that doc.
  #
  # Comma-separated docs/*.md filenames (flat policy; the gate splits on ',').
  embedded_code_doc_exemptions: gemma-and-the-shape-of-doubt.md
  # Comma-separated '<filename>=<reason>' entries. The gate splits on ',' then on
  # the FIRST '=' (str.partition), so a reason MAY contain '=' but MUST NOT
  # contain ',' -- the flat format has no quoting, so a comma would truncate the
  # reason. Semicolons are the intended in-reason separator.
  embedded_code_doc_exemption_reasons: gemma-and-the-shape-of-doubt.md=research evidence log; intentionally embeds source verbatim with sha256 provenance for reproducibility; its SAMPLING_HEALTH_RUNNER block is load-bearing prior art for scripts/build_kaggle_kernel.py
  # A doc listed in embedded_code_doc_exemptions with NO matching reason here
  # still gets a generic 'recorded policy exemption' note (never a silent skip),
  # but such an entry is under-documented: give every exemption a real reason.
  source: deliberate decision 2026-10-04; see docs/gemma-and-the-shape-of-doubt.md header note
